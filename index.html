<!-- Add a comment to trigger a new build -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사다리 타기 게임</title>
    <link rel="stylesheet" href="ladder.css">
</head>
<body>
    <div class="container">
        <h1>사다리 타기 게임</h1>
        <div class="setup">
            <div class="inputs">
                <div class="player-inputs">
                    <h2>플레이어</h2>
                    <input type="text" id="player1" value="플레이어 1">
                    <input type="text" id="player2" value="플레이어 2">
                    <input type="text" id="player3" value="플레이어 3">
                    <input type="text" id="player4" value="플레이어 4">
                    <input type="text" id="player5" value="플레이어 5">
                    <input type="text" id="player6" value="플레이어 6">
                    <input type="text" id="player7" value="플레이어 7">
                    <input type="text" id="player8" value="플레이어 8">
                    <input type="text" id="player9" value="플레이어 9">
                    <input type="text" id="player10" value="플레이어 10">
                </div>
                <div class="result-inputs">
                    <h2>결과</h2>
                    <input type="text" id="result1" value="결과 1">
                    <input type="text" id="result2" value="결과 2">
                    <input type="text" id="result3" value="결과 3">
                    <input type="text" id="result4" value="결과 4">
                    <input type="text" id="result5" value="결과 5">
                    <input type="text" id="result6" value="결과 6">
                    <input type="text" id="result7" value="결과 7">
                    <input type="text" id="result8" value="결과 8">
                    <input type="text" id="result9" value="결과 9">
                    <input type="text" id="result10" value="결과 10">
                </div>
            </div>
            <div class="controls">
                <button id="start-btn">사다리 그리기</button>
                <button id="reset-btn">초기화</button>
                <button id="theme-toggle-btn">테마 전환</button>
            </div>
        </div>
        <canvas id="ladder-canvas" width="600" height="400"></canvas>
        <div id="game-results"></div>
    </div>
    <script src="ladder.js"></script>
</body>
</html>
